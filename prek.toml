# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.15"
hooks = [
  { id = "ruff-check", types_or = ["python", "pyi", "jupyter"], args = ["--fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter"]}
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-ast" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" }
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.9.13"
hooks = [
  { id = "uv-sync" },
  { id = "uv-lock" },
  { id = "uv-export", args = ["--all-groups", "--no-hashes", "--no-annotate", "--output-file", "requirements.txt"], files = "requirements.txt" },
  { id = "uv-export", args = ["--only-group", "inference", "--no-hashes", "--no-annotate", "--output-file", "requirements_inference.txt"], files = "requirements_inference.txt" }
]
